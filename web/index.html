<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stepwise</title>
    <meta name="description" content="Write code, run it in your browser, and step backward through every line." />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand"><a href="./">Stepwise</a></h1>
      <select id="examples" aria-label="Open an example program"></select>
      <button id="share" type="button" class="quiet" title="Copy a link to this program, to send to someone">Share</button>
      <span id="share-status" class="share-status" aria-live="polite"></span>
      <nav>
        <a href="./language.html">The language</a>
        <a href="./how-it-works.html">How it works</a>
      </nav>
    </header>

    <section class="toolbar" aria-label="Run and step through your program">
      <button id="run" type="button" class="run" title="Run your program (Ctrl+Enter)">▶ Run</button>

      <div class="stepper" role="toolbar" aria-label="Step through your program">
        <button id="to-start" type="button" title="Go back to the very beginning (Home key)">⏮ Start</button>
        <button id="step-back" type="button" title="Go back one step (← key)">◀ Back</button>
        <button id="step-forward" type="button" class="next" title="Run the next line (→ key)">Next step ▶</button>
        <button id="to-end" type="button" title="Jump to the end (End key)">End ⏭</button>
        <input id="timeline" type="range" min="0" max="0" value="0" aria-label="Drag to move through the run" />
        <span id="step-label" class="step-label" aria-live="polite"></span>

        <details class="more">
          <summary>More ways to move</summary>
          <div class="menu">
            <button id="step-over" type="button">
              <strong>Skip over function calls</strong>
              <span>Go to the next line here, without going inside functions it calls. Shift + →</span>
            </button>
            <button id="step-out" type="button">
              <strong>Finish this function</strong>
              <span>Run until the current function is done, and go back to where it was called.</span>
            </button>
            <button id="next-break" type="button">
              <strong>Go to the next stop</strong>
              <span>Jump ahead to the next time a line with a stop runs. Page Down</span>
            </button>
            <button id="prev-break" type="button">
              <strong>Back to the previous stop</strong>
              <span>Jump back to the last time a line with a stop ran. Page Up</span>
            </button>
            <p class="menu-hint">To put a stop on a line, click just left of its line number.</p>
          </div>
        </details>
      </div>
    </section>

    <section id="explain" class="explain" aria-live="polite"></section>

    <main>
      <section class="panel editor-panel">
        <h2>Your code</h2>
        <div id="editor"></div>
      </section>
      <div class="side">
        <section class="panel">
          <h2>Variables <span class="sub">their values right now</span></h2>
          <div id="vars" class="vars"></div>
        </section>
        <section class="panel">
          <h2>Output <span class="sub">what <code>print</code> showed, and any problems</span></h2>
          <pre id="output" class="output" aria-live="polite"></pre>
        </section>
        <section class="panel">
          <h2>Functions running <span class="sub">the newest on top</span></h2>
          <div id="stack" class="stack"></div>
        </section>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
