<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stepwise</title>
    <meta name="description" content="Write code, run it in your browser, and step backward through every line." />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <h1>Stepwise</h1>
      <button id="run" type="button" title="Run (Ctrl+Enter)">Run</button>
      <select id="examples" aria-label="Load an example"></select>

      <button id="share" type="button" class="secondary" title="Copy a link to this program">Share</button>
      <span id="share-status" class="notice" aria-live="polite"></span>
      <div class="controls" role="toolbar" aria-label="Step controls">
        <button id="to-start" type="button" class="secondary" title="Go to the start (Home)" aria-label="Go to the start">⏮</button>
        <button id="prev-break" type="button" class="secondary" title="Back to the previous breakpoint (Page Up). Click a line number to set one." aria-label="Previous breakpoint">◀◀</button>
        <button id="step-back" type="button" class="secondary" title="Step back (←, or Alt+← in the editor)">◀ Back</button>
        <button id="step-forward" type="button" class="secondary" title="Step forward (→, or Alt+→ in the editor)">Forward ▶</button>
        <button id="next-break" type="button" class="secondary" title="Continue to the next breakpoint (Page Down). Click a line number to set one." aria-label="Next breakpoint">▶▶</button>
        <button id="to-end" type="button" class="secondary" title="Go to the end (End)" aria-label="Go to the end">⏭</button>
        <button id="step-over" type="button" class="secondary" title="Step over: skip past function calls (Shift+→; Shift+click or Shift+← to go back)">Over</button>
        <button id="step-out" type="button" class="secondary" title="Step out: finish this function (Shift+click to go back to where it was called)">Out</button>
        <input id="timeline" type="range" min="0" max="0" value="0" aria-label="Timeline" />
        <span id="step-label" aria-live="polite"></span>
      </div>
      <nav>
        <a href="./language.html">Language</a>
        <a href="./how-it-works.html">How it works</a>
      </nav>
    </header>
    <main>
      <section class="panel editor-panel">
        <h2>Code</h2>
        <div id="editor"></div>
      </section>
      <div class="side">
        <section class="panel">
          <h2>Call stack</h2>
          <div id="stack" class="stack"></div>
        </section>
        <section class="panel">
          <h2>Variables</h2>
          <div id="vars" class="vars"></div>
        </section>
        <section class="panel output-panel">
          <h2>Output</h2>
          <pre id="output" aria-live="polite"></pre>
        </section>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
