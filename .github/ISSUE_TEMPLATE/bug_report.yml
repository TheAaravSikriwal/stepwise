name: Bug report
description: Something in Stepwise doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: program
    attributes:
      label: The program
      description: Paste the program (or a Share link to it). The smallest program that shows the problem is best.
      render: rust
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Error messages, wrong output, the step where the debugger showed something odd...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Error message (wrong, confusing, or pointing at the wrong place)
        - Wrong output
        - Debugger (stepping, variables, call stack)
        - Editor or page
        - Something else
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on Windows 11