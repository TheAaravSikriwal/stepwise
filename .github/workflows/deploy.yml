name: Deploy site

# Publishes the playground to GitHub Pages at stepwise.wearechintu.com
# (web/public/CNAME), where wearechintu.com/stepwise embeds it.
#
# Manual only until the MVP works (STATUS.md). To go live:
#   1. repo Settings -> Pages -> Source: GitHub Actions
#   2. DNS: CNAME  stepwise -> theaaravsikriwal.github.io
#   3. run this workflow (Actions tab -> Deploy site -> Run workflow)
# Then add `push: branches: [main]` below to deploy on every merge.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run wasm
        working-directory: web
      # Don't publish a site whose tests fail.
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
