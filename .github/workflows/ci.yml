name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --bins
      - run: cargo test --workspace --doc
      - run: cargo test -p stepwise-compiler --test phase0
      # Core pieces still being written: run and report, but don't fail CI.
      # Move each line up (dropping continue-on-error) once its tests pass.
      - name: "In progress: lexer"
        run: cargo test -p stepwise-compiler --test lexer
        continue-on-error: true
      - name: "In progress: parser"
        run: cargo test -p stepwise-compiler --test parser --test parser_depth
        continue-on-error: true
      - name: "In progress: checker"
        run: cargo test -p stepwise-compiler --test checker
        continue-on-error: true
      - name: "In progress: codegen"
        run: cargo test -p stepwise-compiler --test codegen
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run wasm
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
